# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃    WooStoreLink Settings    ┃
# ┃           v.0.9.0           ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# Token generated in your WordPress admin (WooStoreLink settings page).
api-token: "REPLACE_WITH_YOUR_API_TOKEN"

# Your WordPress site URL (no trailing slash)
api-domain: "https://yourdomain.com"

# Language file to load (available: en, es)
language: en

# Interval (in minutes) to automatically check for pending deliveries
check-interval-minutes: 1

# Number of days to keep log files before auto-cleaning
log-retention-days: 30

# Local log file name (inside /plugins/WooStoreLink/transaction-logs/)
log-file: deliveries.log

# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃     Products Configuration     ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
# Map WooCommerce product names or IDs to in-game delivery actions.
# Each product can execute item delivery and/or commands.
# For product variations, using the WooCommerce variation ID is recommended.
# Accepted ID formats include "id:123", "variation:123", "product:123", "wc:123", or "123".
# Product names are still supported for backwards compatibility.

products:
  # Recommended for WooCommerce variations:
  # "product - variation":
  #   commands:
  #     - "lp user {player} parent addtemp vip 30d"

  "example_item":
    items:
      - "minecraft:diamond 3"
      - "minecraft:gold_ingot 5"
    commands:
      - "say Thanks {player} for your order!"
      - "title {player} title {\"text\":\"Thank you!\",\"color\":\"green\"}"

  "example_item - variation":
    items:
      - "minecraft:stick 3"
    commands:
      - "say Thanks {player} for your order!"
      - "title {player} title {\"text\":\"Thank you!\",\"color\":\"green\"}"

  "vip_rank":
    commands:
      - "lp user {player} parent add vip"
      - "say {player} is now VIP!"


# --- Achievements configuration ---
achievements:
  enabled: true

  # Display name used in messages for the counter (e.g., “Purchases”).
  counter-name: "Purchases"

  # List of achievements. They are evaluated when a player receives a delivery.
  # Fields:
  # - id: unique key (lowercase recommended)
  # - count: required total purchases to unlock
  # - title: shown in messages
  # - description: optional text (not shown by default, reserved for future UI)
  # - broadcast: if true, announce the unlock to the whole server
  # - rewards.items: item rewards in "namespace:material amount" format
  # - rewards.commands: console commands; {player} will be replaced with the player name
  list:
    - id: first_purchase
      count: 1
      title: "First Purchase"
      description: "Make your first purchase."
      broadcast: true
      rewards:
        items:
          - "minecraft:diamond 1"
        commands:
          - "tellraw {player} {\"text\":\"Thanks for supporting the server!\",\"color\":\"gold\"}"

    - id: bronze_buyer
      count: 5
      title: "Bronze Buyer"
      description: "Reach 5 purchases."
      broadcast: true
      rewards:
        items:
          - "minecraft:emerald 5"

    - id: silver_buyer
      count: 10
      title: "Silver Buyer"
      description: "Reach 10 purchases."
      broadcast: true
      rewards:
        commands:
          - "lp user {player} parent addtemp vip 7d"
          - "eco give {player} 10000"
